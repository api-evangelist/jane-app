apis:
- aid: jane-app:jane-patients-api
  name: Jane Patients API
  description: >-
    Retrieve, list, and free-text search patient records for the practitioner's accessible
    patients within a clinic. Free-text search is a POST-body endpoint so PII does not leak
    into query strings. Part of the Jane Developer Platform REST API, authenticated with
    OAuth 2.0 (PKCE) and scoped access.
  humanURL: https://developers.jane.app/reference
  tags:
  - Patients
  - Healthcare
  properties:
  - type: Documentation
    url: https://developers.jane.app/docs/getting-started
  - type: APIReference
    url: https://developers.jane.app/reference/getpatients-1
  - type: APIReference
    url: https://developers.jane.app/reference/searchpatients
- aid: jane-app:jane-appointments-api
  name: Jane Appointments API
  description: >-
    Retrieve and list one-on-one appointment bookings for a clinic, with filtering by
    patient, staff member, location, treatment, and time window. Part of the Jane Developer
    Platform REST API.
  humanURL: https://developers.jane.app/reference
  tags:
  - Appointments
  - Scheduling
  properties:
  - type: Documentation
    url: https://developers.jane.app/docs/getting-started
  - type: APIReference
    url: https://developers.jane.app/reference/listappointmentsversioned
  - type: APIReference
    url: https://developers.jane.app/reference/getanappointment
- aid: jane-app:jane-scheduling-api
  name: Jane Practice and Scheduling API
  description: >-
    Read clinic reference and scheduling data — locations, staff members, disciplines,
    treatments, and company details — that underpin booking and practice configuration.
    Part of the Jane Developer Platform REST API.
  humanURL: https://developers.jane.app/reference
  tags:
  - Scheduling
  - Locations
  - Staff
  - Treatments
  properties:
  - type: Documentation
    url: https://developers.jane.app/docs/getting-started
  - type: APIReference
    url: https://developers.jane.app/reference/getlocations-1
  - type: APIReference
    url: https://developers.jane.app/reference/liststaffmembersversioned-1
  - type: APIReference
    url: https://developers.jane.app/reference/listtreatmentsversioned-1
  - type: APIReference
    url: https://developers.jane.app/reference/listdisciplinesversioned-1
  - type: APIReference
    url: https://developers.jane.app/reference/getcompany-1
- aid: jane-app:jane-medical-records-api
  name: Jane Medical Records API
  description: >-
    Create, read, update, and list clinical medical-record data for a patient — observations,
    care plans and care plan activities, and medications (including full medication change
    history). Part of the Jane Developer Platform REST API, gated by clinical scopes.
  humanURL: https://developers.jane.app/reference
  tags:
  - Medical Records
  - Clinical Documentation
  - Healthcare
  properties:
  - type: Documentation
    url: https://developers.jane.app/docs/getting-started
  - type: APIReference
    url: https://developers.jane.app/reference/listobservations
  - type: APIReference
    url: https://developers.jane.app/reference/listcareplans
  - type: APIReference
    url: https://developers.jane.app/reference/listmedications
  - type: APIReference
    url: https://developers.jane.app/reference/getmedicationhistory
- aid: jane-app:jane-documents-api
  name: Jane Documents API
  description: >-
    Upload document files (PDF, JPEG, PNG up to 50 MB) to receive a document ID that can be
    referenced in other API calls, and retrieve a previously uploaded document. Part of the
    Jane Developer Platform REST API.
  humanURL: https://developers.jane.app/reference
  tags:
  - Documents
  - Uploads
  properties:
  - type: Documentation
    url: https://developers.jane.app/docs/getting-started
  - type: APIReference
    url: https://developers.jane.app/reference/postdocumentuploads-1
  - type: APIReference
    url: https://developers.jane.app/reference/getdocumentuploads-1
- aid: jane-app:jane-webhooks-api
  name: Jane Webhooks API
  description: >-
    Register, list, retrieve, and deregister webhook subscriptions so partners receive
    signed event notifications for a clinic. The signing secret is returned only once at
    registration. Part of the Jane Developer Platform REST API.
  humanURL: https://developers.jane.app/reference
  tags:
  - Webhooks
  - Events
  properties:
  - type: Documentation
    url: https://developers.jane.app/docs/getting-started
  - type: APIReference
    url: https://developers.jane.app/reference/postwebhooks
  - type: APIReference
    url: https://developers.jane.app/reference/getwebhooks
- aid: jane-app:jane-extensions-api
  name: Jane Extensions API
  description: >-
    Create, read, update, delete, and list Jane Extensions, and browse the catalog of
    approved extensions available to clinics. This is the management surface for the
    partner integrations built on the Jane Developer Platform.
  humanURL: https://developers.jane.app/reference
  tags:
  - Extensions
  - Integrations
  properties:
  - type: Documentation
    url: https://developers.jane.app/docs/getting-started
  - type: APIReference
    url: https://developers.jane.app/reference/getextensions
  - type: APIReference
    url: https://developers.jane.app/reference/getcatalogextensions
