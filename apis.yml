aid: jane-app
url: https://raw.githubusercontent.com/api-evangelist/jane-app/refs/heads/main/apis.yml
name: Jane
kind: company
description: >-
  Jane is a cloud-based practice management platform for health and wellness clinics,
  headquartered in North Vancouver, Canada, with regional data residency across Canada,
  the USA, the United Kingdom, and Australia. Jane combines online booking, scheduling,
  charting and clinical documentation (including AI-assisted notes), insurance billing,
  payments, patient intake, a patient mobile app, and telehealth in a single system used
  by interdisciplinary clinics — physiotherapy, massage therapy, chiropractic, counselling,
  midwifery, and more. The Jane Developer Platform (developers.jane.app) exposes a documented
  REST API that lets approved Technology Partners build "Jane Extensions" — practitioner-authorized
  integrations that read and write clinic data. Authentication is OAuth 2.0 with PKCE over
  OpenID Connect (Keycloak realms), using RS256 JWT bearer access tokens and granular scopes
  (e.g. observations:read). The API is date-versioned in the URL path and is per-clinic
  (https://<clinic>/api/YYYY-MM-DD/), covering patients, appointments, locations, staff,
  disciplines, treatments, medical records (observations, care plans, medications), document
  uploads, webhooks, and extension management. Jane is not FHIR/HL7-based: it is a proprietary
  REST practice-management API rather than a SMART-on-FHIR EHR interoperability surface.
