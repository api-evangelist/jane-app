apis:
- aid: jane-app:jane-patients-api
  name: Jane Patients API
  description: >-
    Retrieve, list, and free-text search patient records for the practitioner's accessible patients within
    a clinic. Free-text search is a POST-body endpoint so PII does not leak into query strings. Part of
    the Jane Developer Platform REST API, authenticated with OAuth 2.0 (PKCE) and scoped access.
  humanURL: https://developers.jane.app/reference
  tags:
  - Patients
  - Healthcare
  properties:
  - type: Documentation
    url: https://developers.jane.app/docs/getting-started
  - type: APIReference
    url: https://developers.jane.app/reference/getpatients-1
  - type: APIReference
    url: https://developers.jane.app/reference/searchpatients
- aid: jane-app:jane-appointments-api
  name: Jane Appointments API
