  /api/2026-01-01/patients/search:
    post:
      operationId: searchPatients
      summary: Search patients by free text
      description: "Free-text patient search across name, email, phone number, and patient number.\n\n\
        This is a POST-body endpoint specifically so PII (patient names, email, phone)\ndoes not leak\
        \ into URL query strings, access logs, browser history, or referrer headers.\n\nScope is intentionally\
        \ search-only: the body accepts `search`, `sort`, and `page`.\nStructured filters (`public_id`,\
        \ `created_at`, `updated_at`) are not supported here —\nuse `GET /patients` for those. Combined\
        \ search + structured filtering is a deliberate\nfollow-up if a consumer need materializes.\n\n\
        Filter operators:\n- `search`: `co` (contains) only\n\nPagination: the response returns a `cursor`\
        \ and `hasNextPage`. To fetch\nsubsequent pages, re-POST the same body with `page.cursor` set\
        \ to the\nprevious response's `cursor`. The `links` object is omitted from this\nendpoint's response\
        \ (GET-style pagination URLs would re-expose filter PII\nin query strings).\n\nExample body:\n\
        ```json\n{\n  \"search\": { \"co\": \"Jane Smith\" },\n  \"sort\": \"-created_at\",\n  \"page\"\
        : { \"limit\": 50 }\n}\n```\n"
      tags:
      - Patients
      security:
      - OAuth2:
        - patients:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/patients_search_request'
      responses:
        '200':
          description: The paginated list of matching patients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/patients_search_response'
        '400':
          description: The request was invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '429':
          description: Rate limit exceeded - 100 requests per minute per endpoint per clinic
          headers:
            X-Throttle-Match:
              description: Rate limit identifier
              schema:
                type: string
              example: marketing_api/ip/clinic
            Retry-After:
              description: Number of seconds to wait before retrying
              schema:
                type: integer
              example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
